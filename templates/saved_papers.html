<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Saved Papers — ResearchAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --ink: #0D0F1A;
            --surface: #141728;
            --panel: #1C2140;
            --accent: #6C63FF;
            --accent-2: #A78BFA;
            --danger: #FF5C7A;
            --text: #E8EAF6;
            --muted: #8892B0;
            --border: #252B4A;
            --radius: 12px;
        }

        html,
        body {
            min-height: 100vh;
            background: var(--ink);
            color: var(--text);
            font-family: 'Inter', sans-serif;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 18px 48px;
            border-bottom: 1px solid var(--border);
            background: rgba(13, 15, 26, 0.9);
            backdrop-filter: blur(12px);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
            margin-right: auto;
        }

        .nav-brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .nav-brand-name {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 16px;
        }

        .nav-link {
            font-size: 14px;
            color: var(--muted);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .nav-link:hover {
            color: var(--text);
            background: var(--panel);
        }

        .nav-link.active {
            color: var(--accent-2);
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 48px 48px 80px;
        }

        .page-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .paper-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 14px;
        }

        .paper-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .paper-title a {
            color: var(--text);
            text-decoration: none;
        }

        .paper-title a:hover {
            color: var(--accent-2);
        }

        .paper-authors {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 14px;
        }

        .btn-remove {
            display: inline-block;
            padding: 7px 16px;
            border-radius: 8px;
            background: rgba(255, 92, 122, 0.12);
            border: 1px solid rgba(255, 92, 122, 0.35);
            color: #FF8FA3;
            font-size: 13px;
            text-decoration: none;
        }

        .btn-remove:hover {
            background: rgba(255, 92, 122, 0.2);
        }

        .empty {
            text-align: center;
            padding: 80px 24px;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <nav>
        <a href="/dashboard" class="nav-brand">
            <div class="nav-brand-icon">🔬</div>
            <span class="nav-brand-name">ResearchAI</span>
        </a>
        <a href="/search" class="nav-link">Search</a>
        <a href="/ask" class="nav-link">Ask AI</a>
        <a href="/saved-papers" class="nav-link active">Saved</a>
        <a href="/history" class="nav-link">History</a>
    </nav>

    <div class="container">
        <h1 class="page-title">Saved Papers</h1>

        {% for paper in papers %}
        <div class="paper-card">
            <div class="paper-title"><a href="/paper/{{ paper.id }}">{{ paper.title }}</a></div>
            <div class="paper-authors">{{ paper.authors }}</div>
            <a href="/unsave/{{ paper.id }}" class="btn-remove">Remove</a>
        </div>
        {% else %}
        <div class="empty">No saved papers yet.</div>
        {% endfor %}
    </div>
</body>

</html>
