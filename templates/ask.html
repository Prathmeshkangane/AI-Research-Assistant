<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ask AI — ResearchAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --ink: #0D0F1A;
            --surface: #141728;
            --panel: #1C2140;
            --accent: #6C63FF;
            --accent-2: #A78BFA;
            --text: #E8EAF6;
            --muted: #8892B0;
            --border: #252B4A;
            --radius: 12px;
        }

        html,
        body {
            min-height: 100vh;
            background: var(--ink);
            color: var(--text);
            font-family: 'Inter', sans-serif;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 18px 48px;
            border-bottom: 1px solid var(--border);
            background: rgba(13, 15, 26, 0.9);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
            margin-right: auto;
        }

        .nav-brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .nav-brand-name {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 16px;
        }

        .nav-link {
            font-size: 14px;
            color: var(--muted);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .nav-link:hover {
            color: var(--text);
            background: var(--panel);
        }

        .nav-link.active {
            color: var(--accent-2);
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 48px 48px 80px;
        }

        .page-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .ask-box {
            display: flex;
            gap: 10px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 6px;
        }

        .ask-input {
            flex: 1;
            padding: 12px 14px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
        }

        .ask-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            font-weight: 600;
            font-family: 'Space Grotesk', sans-serif;
            cursor: pointer;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 32px 0;
        }

        .section-label {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .answer-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            line-height: 1.7;
            font-size: 15px;
            color: #C0C8E0;
            margin-bottom: 28px;
        }

        .source-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .source-item a {
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
        }

        .source-item a:hover {
            color: var(--accent-2);
        }
    </style>
</head>

<body>
    <nav>
        <a href="/dashboard" class="nav-brand">
            <div class="nav-brand-icon">🔬</div>
            <span class="nav-brand-name">ResearchAI</span>
        </a>
        <a href="/search" class="nav-link">Search</a>
        <a href="/ask" class="nav-link active">Ask AI</a>
        <a href="/saved-papers" class="nav-link">Saved</a>
        <a href="/history" class="nav-link">History</a>
    </nav>

    <div class="container">
        <h1 class="page-title">Ask the Research Assistant</h1>

        <form method="POST">
            <div class="ask-box">
                <input class="ask-input" type="text" name="question" placeholder="Ask a research question..."
                    value="{{ question }}" required autofocus>
                <button type="submit" class="ask-btn">Ask</button>
            </div>
        </form>

        {% if answer %}
        <div class="divider"></div>
        <div class="section-label">Answer</div>
        <div class="answer-panel">{{ answer }}</div>

        <div class="section-label">Sources</div>
        {% for paper in papers %}
        <div class="source-item">
            <a href="/paper/{{ paper.id }}">{{ paper.title }}</a>
        </div>
        {% endfor %}
        {% endif %}
    </div>
</body>

</html>
