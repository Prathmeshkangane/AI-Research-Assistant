istic ideal three-dimensional hydrodynamics. The energy loss of partonic jets is evaluated in the context of gluon bremsstrahlung in the thermalized partonic matter. We provide a systematic analysis of the azimuthal asymmetry of $\\pi_0$ suppression at high $p_T$ in central and non-central collisions, at mid and forward rapidity. The determination of $R_{AA}$ as a function of $p_T$, at different azimuthal angles, and different rapidities makes for a stringent test of our theoretical understanding of jet energy loss over a variety of in-medium path lengths, temperatures and initial partonic jet energies. This lays the groundwork for a precise tomography of the nuclear medium."}, {"id": "0705.1881", "title": "Charged hadron R_AA as a function of p_T at the LHC", "abstract": "We compute the nuclear suppression factor R_AA for charged hadrons within a radiative energy loss picture using a hydrodynamical evolution to describe the soft medium inducing energy loss. A minijet + saturation picture provides initial conditions for LHC energies and leading order perturbative QCD (LO pQCD) is used to compute the parton spectrum before distortion by energy loss."}, {"id": "0705.0953", "title": "Search for color charge dependence of energy loss at RHIC", "abstract": "The non-Abelian feature of quantum chromodynamics (QCD) results in the gluons losing more energy than quarks in the medium formed in high energy heavy-ion collisions. Experimental results in p+p collisions when compared to NLO pQCD calculations show that at high transverse momentum (pT) the produced protons+anti-protons are dominantly from gluon jets and charged pions have substantial contribution from quark jets. If such a scenario is applied to heavy-ion collisions at RHIC, one would expect the difference in quark and gluon energy loss to have an effect on measured observables, such as high pT pbar(p)/pi ratios and the nuclear modification factor for various particles species. We discuss the experimental results and some possible future measurements."}, {"id": "0705.2759", "title": "Stopping Power from SPS to LHC energies", "abstract": "We investigate the energy dependence of hadron production and of stopping power based on HIJING/BBbar v2.0 model calculations. Pseudorapidity spectra and transverse momentum distributions for produced charged particles as well as net baryons (per pair of partcipants) and their rapidity loss are compared to data at RHIC and predictions for LHC energies are discussed."}], "max_similarity": 0.8291, "skipped_llm": false, "threshold": 0.55}, {"id": "on16", "group": "on_topic", "question": "How do routing methods perform on spatial graphs exhibiting critical phase transitions?", "answer": "Based on the provided papers, the available texts do not contain sufficient information regarding \"routing methods\" on spatial graphs. However, Paper [2] discusses searching dynamics on a one-dimensional Euclidean network grown using preferential attachment, which exhibits a static phase transition at $\\alpha_c \\simeq 0.5$ [2]. On this network, three different searching strategies based on degrees, distances, or both were analyzed, and it was found that these strategies are significantly affected by the presence of the static critical point [2].", "sources": [{"id": "0705.0010", "title": "Critical phenomena in complex networks", "abstract": "The combination of the compactness of networks, featuring small diameters, and their complex architectures results in a variety of critical effects dramatically different from those in cooperative systems on lattices. In the last few years, researchers have made important steps toward understanding the qualitatively new critical phenomena in complex networks. We review the results, concepts, and methods of this rapidly developing field. Here we mostly consider two closely related classes of these critical phenomena, namely structural phase transitions in the network architectures and transitions in cooperative models on networks as substrates. We also discuss systems where a network and interacting agents on it influence each other. We overview a wide range of critical phenomena in equilibrium and growing networks including the birth of the giant connected component, percolation, k-core percolation, phenomena near epidemic thresholds, condensation transitions, critical phenomena in spin models placed on networks, synchronization, and self-organized criticality effects in interacting systems on networks. We also discuss strong finite size effects in these systems and highlight open problems and perspectives."}, {"id": "0705.0580", "title": "Effect of a static phase transition on searching dynamics", "abstract": "We consider a one dimensional Euclidean network which is grown using a preferential attachment. Here the $j$th incoming node gets attached to the $i$th existing node with the probability $\\Pi_i \\propto k_i {{l}}_{ij}^\\alpha$, where ${l}_{ij}$ is the Euclidean distance between them and $k_i$ the degree of the $i$th node. This network is known to have a static phase transition point at $\\alpha_c \\simeq 0.5$. On this network, we employ three different searching strategies based on degrees or distances or both, where the possibility of termination of search chains is allowed. A detailed analysis shows that these strategies are significantly affected by the presence of the static critical point. The distributions of the search path lengths and the success rates are also estimated and compared for the different strategies. These distributions appear to be marginally affected by the static phase transition."}, {"id": "0704.1269", "title": "Phase Transitions in the Coloring of Random Graphs", "abstract": "We consider the problem of coloring the vertices of a large sparse random graph with a given number of colors so that no adjacent vertices have the same color. Using the cavity method, we present a detailed and systematic analytical study of the space of proper colorings (solutions). We show that for a fixed number of colors and as the average vertex degree (number of constraints) increases, the set of solutions undergoes several phase transitions similar to those observed in the mean field theory of glasses. First, at the clustering transition, the entropically dominant part of the phase space decomposes into an exponential number of pure states so that beyond this transition a uniform sampling of solutions becomes hard. Afterward, the space of solutions condenses over a finite number of the largest states and consequently the total entropy of solutions becomes smaller than the annealed one. Another transition takes place when in all the entropically dominant states a finite fraction of nodes freezes so that each of these nodes is allowed a single color in all the solutions inside the state. Eventually, above the coloring threshold, no more solutions are available. We compute all the critical connectivities for Erdos-Renyi and regular random graphs and determine their asymptotic values for large number of colors. Finally, we discuss the algorithmic consequences of our findings. We argue that the onset of computational hardness is not associated with the clustering transition and we suggest instead that the freezing transition might be the relevant phenomenon. We also discuss the performance of a simple local Walk-COL algorithm and of the belief propagation algorithm in the light of our results."}, {"id": "0705.0087", "title": "Percolation transition in networks with degree-degree correlation", "abstract": "We introduce an exponential random graph model for networks with a fixed degree distribution and with a tunable degree-degree correlation. We then investigate the nature of a percolation transition in the correlated network with the Poisson degree distribution. It is found that negative correlation is irrelevant in that the percolation transition in the disassortative network belongs to the same universality class of the uncorrelated network. Positive correlation turns out to be relevant. The percolation transition in the assortative network is characterized by the non-diverging mean size of finite clusters and power-law scalings of the density of the largest cluster and the cluster size distribution in the non-percolating phase as well as at the critical point. Our results suggest that the unusual type percolation transition in the growing network models reported recently may be inherited from the assortative degree-degree correlation."}, {"id": "0705.4551", "title": "Site Percolation on Planar $\\Phi^{3}$ Random Graphs", "abstract": "In this paper, site percolation on random $\\Phi^{3}$ planar graphs is studied by Monte-Carlo numerical techniques. The method consists in randomly removing a fraction $q=1-p$ of vertices from graphs generated by Monte-Carlo simulations, where $p$ is the occupation probability. The resulting graphs are made of clusters of occupied sites. By measuring several properties of their distribution, it is shown that percolation occurs for an occupation probability above a percolation threshold $p_{c}$=0.7360(5). Moreover, critical exponents are compatible with those analytically known for bond percolation."}], "max_similarity": 0.8197, "skipped_llm": false, "threshold": 0.55}, {"id": "on17", "group": "on_topic", "question": "Can interactive game models help determine type equivalences in classical polymorphic programming languages?", "answer": "Yes, game semantics and game models can be used to study and characterize type isomorphisms (equivalences) in polymorphic calculi and classical logic. Specifically, for the second-order $\\mu$-calculus—which extends system F to classical logic—a game model based on polymorphic arenas allows researchers to show that type isomorphisms coincide with the \"equality\" on arenas associated with types, leading directly to an equational characterization of these isomorphisms [2].", "sources": [{"id": "0705.4228", "title": "Curry-style type Isomorphisms and Game Semantics", "abstract": "Curry-style system F, ie. system F with no explicit types in terms, can be seen as a core presentation of polymorphism from the point of view of programming languages. This paper gives a characterisation of type isomorphisms for this language, by using a game model whose intuitions come both from the syntax and from the game semantics universe. The model is composed of: an untyped part to interpret terms, a notion of game to interpret types, and a typed part to express the fact that an untyped strategy plays on a game. By analysing isomorphisms in the model, we prove that the equational system corresponding to type isomorphisms for Curry-style system F is the extension of the equational system for Church-style isomorphisms with a new, non-trivial equation: forall X.A = A[forall Y.Y/X] if X appears only positively in A."}, {"id": "0705.4226", "title": "Second-Order Type Isomorphisms Through Game Semantics", "abstract": "The characterization of second-order type isomorphisms is a purely syntactical problem that we propose to study under the enlightenment of game semantics. We study this question in the case of second-order &#955;$\\mu$-calculus, which can be seen as an extension of system F to classical logic, and for which we de&#64257;ne a categorical framework: control hyperdoctrines. Our game model of &#955;$\\mu$-calculus is based on polymorphic arenas (closely related to Hughes' hyperforests) which evolve during the play (following the ideas of Murawski-Ong). We show that type isomorphisms coincide with the \"equality\" on arenas associated with types. Finally we deduce the equational characterization of type isomorphisms from this equality. We also recover from the same model Roberto Di Cosmo's characterization of type isomorphisms for system F. This approach leads to a geometrical comprehension on the question of second order type isomorphisms, which can be easily extended to some other polymorphic calculi including additional programming features."}, {"id": "0705.4126", "title": "EF equivalent not isomorphic models", "abstract": "We construct non-isomorphic models M, N, e.g. of cardinality aleph_1 such that in the Ehrenfeucht-Fraisse game of length zeta < omega_1 the isomorphism player wins"}, {"id": "0705.1260", "title": "Quantum-like Representation of Extensive Form Games: Wine Testing Game", "abstract": "We consider an application of the mathematical formalism of quantum mechanics (QM) outside physics, namely, to game theory. We present a simple game between macroscopic players, say Alice and Bob (or in a more complex form - Alice, Bob and Cecilia), which can be represented in the quantum-like (QL) way -- by using a complex probability amplitude (game's ``wave function'') and noncommutative operators. The crucial point is that games under consideration are so called extensive form games. Here the order of actions of players is important, such a game can be represented by the tree of actions. The QL probabilistic behavior of players is a consequence of incomplete information which is available to e.g. Bob about the previous action of Alice. In general one could not construct a classical probability space underlying a QL-game. This can happen even in a QL-game with two players. In a QL-game with three players Bell's inequality can be violated. The most natural probabilistic description is given by so called contextual probability theory completed by the frequency definition of probability."}, {"id": "0705.0462", "title": "Resource modalities in game semantics", "abstract": "The description of resources in game semantics has never achieved the simplicity and precision of linear logic, because of a misleading conception: the belief that linear logic is more primitive than game semantics. We advocate instead the contrary: that game semantics is conceptually more primitive than linear logic. Starting from this revised point of view, we design a categorical model of resources in game semantics, and construct an arena game model where the usual notion of bracketing is extended to multi- bracketing in order to capture various resource policies: linear, af&#64257;ne and exponential."}], "max_similarity": 0.8598, "skipped_llm": false, "threshold": 0.55}, {"id": "on18", "group": "on_topic", "question": "What do ultraviolet and optical stellar surveys reveal about the spatial arrangement of peculiar evolved stars inside globular clusters?", "answer": "Based on the provided research papers, there is no mention of \"ultraviolet and optical stellar surveys\" revealing information about the spatial arrangement of peculiar evolved stars inside globular clusters. Therefore, the available papers do not contain sufficient information to answer the question.", "sources": [{"id": "0704.0535", "title": "The Formation of Globular Cluster Systems in Massive Elliptical Galaxies: Globular Cluster Multimodality from Radial Variation of Stellar Populations", "abstract": "The most massive elliptical galaxies show a prominent multi-modality in their globular cluster system color distributions. Understanding the mechanisms which lead to multiple globular cluster sub-populations is essential for a complete picture of massive galaxy formation. By assuming that globular cluster formation traces the total star formation and taking into account the radial variations in the composite stellar populations predicted by the Pipino & Matteucci (2004) multi-zone photo-chemical evolution code, we compute the distribution of globular cluster properties as a function of galactocentric radius. We compare our results to the spectroscopic measurements of globular clusters in nearby early-type galaxies by Puzia et al. (2006) and show that the observed multi-modality in globular cluster systems of massive ellipticals can be, at least partly, ascribed to the radial variation in the mix of stellar populations. Our model predicts the presence of a super-metal-rich population of globular clusters in the most massive elliptical galaxies, which is in very good agreement with the spectroscopic observations. Furthermore, we investigate the impact of other non-linear mechanisms that shape the metallicity distribution of globular cluster systems, in particular the role of merger-induced globular cluster formation and a non-linear color-metallicity transformation, and discuss their influence in the context of our model (abridged)"}, {"id": "0705.4037", "title": "An updated survey of globular clusters in M31. II Newly discovered bright and remote clusters", "abstract": "We present the first results of a large spectroscopic survey of candidate globular clusters located in the extreme outskirts of the nearby M31 galaxy. We obtained low resolution spectra of 48 targets selected from the XSC of 2MASS, as in Galleti et al. (2005). The observed candidates have been robustly classified according to their radial velocity and by verifying their extended/point-source nature from ground-based optical images. Among the 48 observed candidates clusters we found 5 genuine remote globular clusters. One of them has been already identified independently by Mackey et al. (2007), their GC1; the other four are completely new discoveries: B516, B517, B518, B519. The newly discovered clusters lie at projected distance 40 kpc<~R_p<~100 kpc from the center of M31, and have absolute integrated magnitude -9.5<M_V<-7.5. For all the observed clusters we have measured the strongest Lick indices and we have obtained spectroscopic metallicity estimates. Mackey-GC1, Martin-GC1, B517 and B518 have spectra typical of old and metal poor globular clusters ([Fe/H]<~ -1.3); B519 appears old but quite metal-rich ([Fe/H]~-0.5); B516 presents very strong Balmer absorption lines: if this is indeed a cluster it should have a relatively young age (likely <2 Gyr). The present analysis nearly doubles the number of M31 globulars at R_p> 40 kpc. At odds with the Milky Way, M31 appears to have a significant population of very bright globular clusters in its extreme outskirts."}, {"id": "0705.0780", "title": "Massive stars and globular cluster formation", "abstract": "We first present chemodynamical simulations to investigate how stellar winds of massive stars influence early dynamical and chemical evolution of forming globular clusters (GCs). In our numerical models, GCs form in turbulent,high-density giant molecular clouds (GMCs), which are embedded in a massive dark matter halo at high redshifts. We show how high-density, compact stellar systems are formed from GMCs influenced both by physical processes associated with star formation and by tidal fields of their host halos. We also show that chemical pollution of GC-forming GMCs by stellar winds from massive stars can result in star-to-star abundance inhomogeneities among light elements (e.g., C, N, and O) of stars in GCs. The present model with a canonical initial mass function (IMF) also shows a C-N anticorrelation that stars with smaller [C/Fe] have larger [N/Fe] in a GC. Although these results imply that ``self-pollution'' of GC-forming GMCs by stellar winds from massive stars can cause abundance inhomogeneities of GCs, the present models with different parameters and canonical IMFs can not show N-rich stars with [N/Fe] ~ 0.8 observed in some GCs (e.g., NGC 6752). We discuss this apparent failure in the context of massive star formation preceding low-mass one within GC-forming GMCs (``bimodal star formation scenario''). We also show that although almost all stars (~97%) show normal He abundances (Y) of ~0.24 some stars later formed in GMCs can have Y as high as ~0.3 in some models. The number fraction of He-rich stars with Y >0.26 is however found to be small (~10^-3) for most models."}, {"id": "0706.0847", "title": "The ACS Survey of Galactic Globular Clusters. II. Stellar Evolution Tracks, Isochrones, Luminosity Functions, and Synthetic Horizontal-Branch Models", "abstract": "The ACS Survey of Galactic Globular Clusters, an HST Treasury Project, will deliver high quality, homogeneous photometry of 65 globular clusters. This paper introduces a new collection of stellar evolution tracks and isochrones suitable for analyzing the ACS Survey data. Stellar evolution models were computed at [Fe/H]= -2.5, -2.0, -1.5, -1.0, -0.5, and 0; [alpha/Fe]= -0.2, 0, 0.2, 0.4, 0.6, and 0.8; and three initial He abundances for masses from 0.1 to 1.8 Msun and ages from 2 to 15 Gyr. Each isochrone spans a wide range in luminosity from Mv~14 up to the tip of the red giant branch. These are complemented by a set of He-burning tracks that extend from the zero age horizontal branch to the onset of thermal pulsations on the asymptotic giant branch. In addition, a set of computer programs are provided that make it possible to interpolate the isochrones in [Fe/H], generate luminosity functions from the isochrones, and create synthetic horizontal branch models. The tracks and isochrones have been converted to the observational plane with two different color-Teff transformations, one synthetic and one semi-empirical, in ground-based B, V, and I, and F606W and F814W for both ACS-WFC and WFPC2 systems. All models and programs presented in this paper are available from http://stellar.dartmouth.edu/~models/"}, {"id": "0704.0486", "title": "Kinematic Decoupling of Globular Clusters with Extended Horizontal-Branch", "abstract": "About 25% of the Milky Way globular clusters (GCs) exhibit unusually extended color distribution of stars in the horizontal-branch (HB) phase. This phenomenon is now best understood as due to the presence of helium enhanced second generation subpopulations, which has raised a possibility that these peculiar GCs might have a unique origin. Here we show that these GCs with extended HB are clearly distinct from other normal GCs in kinematics and mass. The GCs with extended HB are more massive than normal GCs, and are dominated by random motion with no correlation between kinematics and metallicity. Surprisingly, however, when they are excluded, most normal GCs in the inner halo show clear signs of dissipational collapse that apparently led to the formation of the disk. Normal GCs in the outer halo share their kinematic properties with the extended HB GCs, which is consistent with the accretion origin. Our result further suggests heterogeneous origins of GCs, and we anticipate this to be a starting point for more detailed investigations of Milky Way formation, including early mergers, collapse, and later accretion."}], "max_similarity": 0.807, "skipped_llm": false, "threshold": 0.55}, {"id": "on19", "group": "on_topic", "question": "What mathematical mechanisms explain how molecular motors aggregate via asymmetric potential drift diffusion models?", "answer": "Based on the provided papers, the mathematical analysis of the concentration (appearing as Dirac masses) of solutions to a Fokker-Planck system with asymmetric potentials—which is proposed as a model for motor proteins moving along molecular filaments—is based on the study of a Hamilton-Jacobi equation [1]. This Hamilton-Jacobi equation arises at the zero diffusion limit after an exponential transformation change of the phase function [1].", "sources": [{"id": "0705.2878", "title": "Asymmetric potentials and motor effect: a large deviation approach", "abstract": "We provide a mathematical analysis of appearance of the concentrations (as Dirac masses) of the solution to a Fokker-Planck system with asymmetric potentials. This problem has been proposed as a model to describe motor proteins moving along molecular filaments. The components of the system describe the densities of the different conformations of the proteins. Our results are based on the study of a Hamilton-Jacobi equation arising, at the zero diffusion limit, after an exponential transformation change of the phase function that rises a Hamilton-Jacobi equation. We consider different classes of conformation transitions coefficients (bounded, unbounded and locally vanishing)."}, {"id": "0705.2905", "title": "Brownian ratchets driven by asymmetric nucleation of hydrolysis waves", "abstract": "We propose a stochastic process wherein molecular transport is mediated by asymmetric nucleation of domains on a one-dimensional substrate. Track-driven mechanisms of molecular transport arise in biophysical applications such as Holliday junction positioning and collagenase processivity. In contrast to molecular motors that hydrolyze nucleotide triphosphates and undergo a local molecular conformational change, we show that asymmetric nucleation of hydrolysis waves on a track can also result in directed motion of an attached particle. Asymmetrically cooperative kinetics between ``hydrolyzed'' and ``unhydrolyzed'' states on each lattice site generate moving domain walls that push a particle sitting on the track. We use a novel fluctuating-frame, finite-segment mean field theory to accurately compute steady-state velocities of the driven particle and to discover parameter regimes which yield maximal domain wall flux, leading to optimal particle drift."}, {"id": "0705.0690", "title": "Dynamic Properties of Molecular Motors in Burnt-Bridge Models", "abstract": "Dynamic properties of molecular motors that fuel their motion by actively interacting with underlying molecular tracks are studied theoretically via discrete-state stochastic ``burnt-bridge'' models. The transport of the particles is viewed as an effective diffusion along one-dimensional lattices with periodically distributed weak links. When an unbiased random walker passes the weak link it can be destroyed (``burned'') with probability p, providing a bias in the motion of the molecular motor. A new theoretical approach that allows one to calculate exactly all dynamic properties of motor proteins, such as velocity and dispersion, at general conditions is presented. It is found that dispersion is a decreasing function of the concentration of bridges, while the dependence of dispersion on the burning probability is more complex. Our calculations also show a gap in dispersion for very low concentrations of weak links which indicates a dynamic phase transition between unbiased and biased diffusion regimes. Theoretical findings are supported by Monte Carlo computer simulations."}, {"id": "0705.0138", "title": "Symmetry Relations for Trajectories of a Brownian Motor", "abstract": "A Brownian Motor is a nanoscale or molecular device that combines the effects of thermal noise, spatial or temporal asymmetry, and directionless input energy to drive directed motion. Because of the input energy, Brownian motors function away from thermodynamic equilibrium and concepts such as linear response theory, fluctuation dissipation relations, and detailed balance do not apply. The {\\em generalized} fluctuation-dissipation relation, however, states that even under strongly thermodynamically non-equilibrium conditions the ratio of the probability of a transition to the probability of the time-reverse of that transition is the exponent of the change in the internal energy of the system due to the transition. Here, we derive an extension of the generalized fluctuation dissipation theorem for a Brownian motor for the ratio between the probability for the motor to take a forward step and the probability to take a backward step."}, {"id": "0704.3802", "title": "Entropic Studies of Cytoskeletal Motors Jamming", "abstract": "Can the different causes for disruption of intracellular transport be traced from the trajectories of the molecular motors on the cytoskeletal filaments? We will attempt to answer this important question in a Monte Carlo model of microtubule-motor protein interaction from the point of view of information theory."}], "max_similarity": 0.8298, "skipped_llm": false, "threshold": 0.55}, {"id": "on20", "group": "on_topic", "question": "Where might we find evidence of physics beyond standard particle mixing frameworks?", "answer": "Based on the provided papers, evidence or probes of physics beyond the Standard Model frameworks can be found in:\n\n* **$D^0$-$\\bar{D}^0$ mixing and $K^0$-$\\bar{K^0}$ and $B_{(s)}^0$-$\\bar{B^0_{(s)}}$ mixing:** The mixing of neutral mesons provides a sensitive probe to explore new physics beyond the Standard Model [4], with $D^0$-$\\bar{D}^0$ mixing offering an important test of flavor-changing neutral currents in the up-quark sector [2] and setting stringent constraints on unparticle couplings to quarks [4].\n* **Solar and KamLAND neutrinos:** Particle interferometry and the propagation of electron neutrinos in the Sun and the KamLAND reactor experiment provide probes to test for non-standard decoherence effects (which might be induced by quantum gravity) at neutrino energies of $E \\sim \\text{few MeV}$ [3].\n* **Fermion mixing angles and matrices:** Potential small deviations from the unitarity of the mixing matrix due to mass splittings in coupled systems, as well as specific patterns such as quark-lepton complementarity, indicate special patterns that presumably originate in physics beyond the Standard Model [5].", "sources": [{"id": "0704.2276", "title": "Physics Beyond the Standard Model and Dark Matter", "abstract": "In this lecture note, I discuss why many of us are expecting rich physics at the TeV scale, drawing analogies from the history of physics in the last century. Then I review some of the possible candidates of new physics at this energy scale. I also discuss why we believe much of the matter in the universe is not atoms (baryons) or compact astronomical objects, and hence requires physics beyond the standard model. Finally I discuss some of the candidates for the non-baryonic dark matter."}, {"id": "0705.3650", "title": "Implications of D^0-\\bar D^0 Mixing for New Physics", "abstract": "We provide a comprehensive, up-to-date analysis of possible New Physics contributions to the mass difference $\\Delta M_D$ in $D^0$-${\\bar D}^0$ mixing. We consider the most general low energy effective Hamiltonian and include leading order QCD running of effective operators. We then explore an extensive list of possible New Physics models that can generate these operators, which we organize as including Extra Fermions, Extra Gauge Bosons, Extra Scalars, Extra Space Dimensions and Extra Symmetries. For each model we place restrictions on the allowed parameter space using the recent evidence for observation of $D$ meson mixing. In many scenarios, we find strong constraints that surpass those from other search techniques and provide an important test of flavor changing neutral currents in the up-quark sector. We also review the recent BaBar and Belle findings, and describe the current status of the Standard Model predictions of $D^0$-${\\bar D}^0$ mixing."}, {"id": "0704.2568", "title": "Probing non-standard decoherence effects with solar and KamLAND neutrinos", "abstract": "It has been speculated that quantum gravity might induce a \"foamy\" space-time structure at small scales, randomly perturbing the propagation phases of free-streaming particles (such as kaons, neutrons, or neutrinos). Particle interferometry might then reveal non-standard decoherence effects, in addition to standard ones (due to, e.g., finite source size and detector resolution.) In this work we discuss the phenomenology of such non-standard effects in the propagation of electron neutrinos in the Sun and in the long-baseline reactor experiment KamLAND, which jointly provide us with the best available probes of decoherence at neutrino energies E ~ few MeV. In the solar neutrino case, by means of a perturbative approach, decoherence is shown to modify the standard (adiabatic) propagation in matter through a calculable damping factor. By assuming a power-law dependence of decoherence effects in the energy domain (E^n with n = 0,+/-1,+/-2), theoretical predictions for two-family neutrino mixing are compared with the data and discussed. We find that neither solar nor KamLAND data show evidence in favor of non-standard decoherence effects, whose characteristic parameter gamma_0 can thus be significantly constrained. In the \"Lorentz-invariant\" case n=-1, we obtain the upper limit gamma_0<0.78 x 10^-26 GeV at 95% C.L. In the specific case n=-2, the constraints can also be interpreted as bounds on possible matter density fluctuations in the Sun, which we improve by a factor of ~ 2 with respect to previous analyses."}, {"id": "0705.1821", "title": "Unparticle Physics Effects on D0-anti-D0 Mixing", "abstract": "The mixing of $K^0-\\bar{K^0}$, $D^0-\\bar{D^0}$ and $B_{(s)}^0-\\bar{B^0_{(s)}}$ provides a sensitive probe to explore new physics beyond the Standard Model. The scale invariant unparticle physics recently proposed by Georgi can induce flavor-changing neutral current and contribute to the mixing at tree level. We investigate the unparticle effects on $B^0-\\bar{B^0}$ and $D^0-\\bar{D^0}$ mixing. Especially, the newly observed $D^0-\\bar{D^0}$ mixing sets the most stringent constraints on the coupling of the unparticle to quarks."}, {"id": "0705.1237", "title": "The neighborhood of the Standard Model: mixing angles and quark-lepton complementarity for three generations of non-degenerate coupled fermions", "abstract": "We investigate the potential (small) deviations from the unitarity of the mixing matrix that are expected to occur, because of mass splittings, in the Quantum Field Theory of non-degenerate coupled systems. We extend our previous analysis concerning mixing angles, which led to a precise determination of the Cabibbo angle, to the case of three generations of fermions. We show that the same condition for neutral currents of mass eigenstates, i.e. that universality of diagonal currents is violated with the same strength as the absence of non-diagonal ones, is satisfied: on one hand, by the three CKM mixing angles with a precision higher than the experimental uncertainty; on the other hand, by a neutrino-like mixing pattern in which theta_{23} is maximal, and tan (2 theta_{12})=2. This last pattern turns out to satisfy exactly the \"quark-lepton complementarity condition\" theta_c + theta_{12}= pi/4. Moreover, among all solutions, two values for the third neutrino mixing angle arise which satisfy the bound sin^2(theta_{13}) < 0.1: theta_{13} = +/- 5.7 10^{-3} and theta_{13} = +/- 0.2717. The so-called \"Neighborhood of the Standard Model\" is thus confirmed to exhibit special patterns which presumably originate in physics \"Beyond the Standard Model\"."}], "max_similarity": 0.7692, "skipped_llm": false, "threshold": 0.55}], LABELS={"on_topic": [["supported", "Supported: every claim is backed by the sources and the [n] citations are right"], ["partial", "Partly supported: some claim is not in the sources, or a citation is wrong"], ["unsupported", "Unsupported: mostly not backed by the sources / made up"], ["false_refusal", "False refusal: says there is not enough information although the sources do answer it"]], "off_topic": [["correct_refusal", "Correct: it declines / says the papers do not cover this"], ["answered_anyway", "Wrong: it answers the question anyway"]]}, KEY="faith_labels_v1";
let saved=JSON.parse(localStorage.getItem(KEY)||"{}");
const root=document.getElementById("items");
function el(t,c,x){const e=document.createElement(t); if(c) e.className=c; if(x!==undefined) e.textContent=x; return e;}
DATA.forEach(d=>{
  const card=el("div","card"); card.id=d.id;
  card.appendChild(el("div","tag",d.id+" · "+d.group.replace("_","-")+" · max similarity "+d.max_similarity+(d.skipped_llm?" · LLM skipped (below threshold)":"")));
  card.appendChild(el("div","q",d.question));
  card.appendChild(el("div","ans",d.answer));
  if(d.sources.length){
    const det=el("details"); det.appendChild(el("summary","","Sources ("+d.sources.length+") - open to check the claims"));
    d.sources.forEach((s,i)=>{det.appendChild(el("div","",(i+1)+". "+s.title+"  [arXiv:"+s.id+"]")); det.appendChild(el("div","abs",s.abstract));});
    card.appendChild(det);
  }
  (LABELS[d.group]||[]).forEach(([val,text])=>{
    const l=el("label"); const r=document.createElement("input"); r.type="radio"; r.name=d.id; r.value=val;
    if((saved[d.id]||{}).label===val) r.checked=true;
    r.addEventListener("change",()=>{saved[d.id]={label:val,note:note.value}; persist();});
    l.appendChild(r); l.appendChild(document.createTextNode(" "+text)); card.appendChild(l);
  });
  const note=el("input"); note.type="text"; note.placeholder="optional note (what was wrong?)"; note.value=(saved[d.id]||{}).note||"";
  note.addEventListener("input",()=>{ if(saved[d.id]){saved[d.id].note=note.value; persist();}});
  card.appendChild(note); root.appendChild(card);
});
function persist(){localStorage.setItem(KEY,JSON.stringify(saved)); progress();}
function progress(){const n=DATA.filter(d=>saved[d.id]&&saved[d.id].label).length;
  document.getElementById("prog").textContent=n+" / "+DATA.length+" labelled";
  DATA.forEach(d=>document.getElementById(d.id).classList.toggle("done",!!(saved[d.id]&&saved[d.id].label)));}
function exportLabels(){const blob=new Blob([JSON.stringify(saved,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="faith_labels.json"; a.click();}
document.getElementById("dl").addEventListener("click",exportLabels); progress();
