<script>
const DATA=[{"id": "on01", "group": "on_topic", "question": "Why does melted sulfur experience such massive viscosity shifts near specific thermal points?", "answer": "The available papers do not contain sufficient information to explain why melted sulfur experiences such massive viscosity shifts near specific thermal points. While one paper notes an abrupt increase in viscosity by four orders of magnitude upon heating within a few degrees around $T_\\lambda$ in liquid sulfur, and reveals a chain relaxation process that helps rationalize the mechanical and thermodynamic behavior within a viscoelastic scenario, it does not explicitly state the causal mechanism for the massive viscosity shifts [1].", "sources": [{"id": "0706.0170", "title": "On the origin of the $\\lambda$-transition in liquid Sulphur", "abstract": "Developing a novel experimental technique, we applied photon correlation spectroscopy using infrared radiation in liquid Sulphur around $T_\\lambda$, i.e. in the temperature range where an abrupt increase in viscosity by four orders of magnitude is observed upon heating within few degrees. This allowed us - overcoming photo-induced and absorption effects at visible wavelengths - to reveal a chain relaxation process with characteristic time in the ms range. These results do rehabilitate the validity of the Maxwell relation in Sulphur from an apparent failure, allowing rationalizing the mechanical and thermodynamic behavior of this system within a viscoelastic scenario."}, {"id": "0704.2412", "title": "Giant viscosity enhancement in a spin-polarized Fermi liquid", "abstract": "The viscosity is measured for a Fermi liquid, a dilute $^3$He-$^4$He mixture, under extremely high magnetic field/temperature conditions ($B \\leq 14.8$ T, $T \\geq 1.5$ mK). The spin splitting energy $\\mu B$ is substantially greater than the Fermi energy $k_B T_F$; as a consequence the polarization tends to unity and s-wave quasiparticle scattering is suppressed for $T \\ll T_F$. Using a novel composite vibrating-wire viscometer an enhancement of the viscosity is observed by a factor of more than 500 over its low-field value. Good agreement is found between the measured viscosity and theoretical predictions based upon a $t$-matrix formalism."}, {"id": "0705.3909", "title": "Bulk viscosity in a cold CFL superfluid", "abstract": "We compute one of the bulk viscosity coefficients of cold CFL quark matter in the temperature regime where the contribution of mesons, quarks and gluons to transport phenomena is Boltzmann suppressed. In that regime dissipation occurs due to collisions of superfluid phonons, the Goldstone modes associated to the spontaneous breaking of baryon symmetry. We first review the hydrodynamics of relativistic superfluids, and remind that there are at least three bulk viscosity coefficients in these systems. We then compute the bulk viscosity coefficient associated to the normal fluid component of the superfluid. In our analysis we use Son's effective field theory for the superfluid phonon, amended to include scale breaking effects proportional to the square of the strange quark mass m_s. We compute the bulk viscosity at leading order in the scale breaking parameter, and find that it is dominated by collinear splitting and joining processes. The resulting transport coefficient is zeta=0.011 m_s^4/T, growing at low temperature T until the phonon fluid description stops making sense. Our results are relevant to study the rotational properties of a compact star formed by CFL quark matter."}, {"id": "0705.1277", "title": "Strongly Interacting Low Viscosity Matter Created in Heavy Ion Collisions", "abstract": "Substantial collective flow is observed in collisions between large nuclei at high energy, as evidenced by single-particle transverse momentum distributions and by azimuthal correlations among the produced particles. The data are well-reproduced by perfect fluid dynamics. In a separate development, calculation of the dimensionless ratio of shear viscosity eta to entropy density s by Kovtun, Son and Starinets within AdS/CFT yields eta/s = 1/4pi, and they conjectured that this is a lower bound for any physical system. It is shown that the transition from hadrons to quarks and gluons has behavior similar to helium, nitrogen, and water at and near their phase transitions in the ratio eta/s. Therefore it is possible that experimental measurements can pinpoint the location of this transition or rapid crossover in QCD via the viscosity to entropy ratio in addition to and independently of the equation of state."}, {"id": "0705.0381", "title": "How short-range attractions impact the structural order, self-diffusivity, and viscosity of a fluid", "abstract": "We present molecular simulation data for viscosity, self-diffusivity, and the local structural ordering of (i) a hard-sphere fluid and (ii) a square-well fluid with short-range attractions. The latter fluid exhibits a region of dynamic anomalies in its phase diagram, where its mobility increases upon isochoric cooling, which is found to be a subset of a larger region of structural anomalies, in which its pair correlations strengthen upon isochoric heating. This \"cascade of anomalies\" qualitatively resembles that found in recent simulations of liquid water. The results for the hard-sphere and square-well systems also show that the breakdown of the Stokes-Einstein relation upon supercooling occurs for conditions where viscosity and self-diffusivity develop different couplings to the degree of pairwise structural ordering of the liquid. We discuss how these couplings reflect dynamic heterogeneities. Finally, we note that the simulation data suggests how repulsive and attractive glasses may generally be characterized by two distinct levels of short-range structural order."}], "max_similarity": 0.7704, "skipped_llm": false, "threshold": 0.55}, {"id": "on02", "group": "on_topic", "question": "How does rotation in nuclear reactions generate separated electric charges?", "answer": "The angular momentum of QCD matter, when combined with a non-zero topological charge, can induce an electric field aligned along the axis of the angular momentum [1]. This process leads to an electric charge asymmetry in relativistic heavy ion collisions [1].", "sources": [{"id": "0706.1026", "title": "Charge separation induced by P-odd bubbles in QCD matter", "abstract": "We examine the recent suggestion that P- and CP-odd effects in QCD matter can induce electric charge asymmetry with respect to reaction plane in relativistic heavy ion collisions. General arguments are given which confirm that the angular momentum of QCD matter in the presence of non-zero topological charge should induce an electric field aligned along the axis of the angular momentum. A simple formula relating the magnitude of charge asymmetry to the angular momentum and topological charge is derived. The expected asymmetry is amenable to experimental observation at RHIC and LHC; we discuss the recent preliminary STAR result in light of our findings."}, {"id": "0704.2653", "title": "Investigation of Neutron--Deuteron Charge-Exchange Reaction at Small Transfer Momentum", "abstract": "Analysis of the $nd\\to p(nn)$ reaction in a GeV-energy region is performed in the framework based on the multiple-scattering theory for the few-nucleon system. The special kinematic condition, when momentum transfer from neutron beam to final proton closes to zero, is considered. The possibility to extract the spin-dependent term of the elementary $np\\to pn $ amplitude from $nd$-breakup process is investigated. The energy dependence of the ratio $R=\\frac{d\\sigma_{nd}} {d\\Omega} / \\frac{d\\sigma_{np}}{d\\Omega}$ is obtained taking account of the final-state interaction of the two outgoing neutrons in $^1 S_0$-state."}, {"id": "0705.4133", "title": "Scattering polarization of hydrogen lines from electric-induced atomic alignment", "abstract": "We consider a gas of hydrogen atoms illuminated by a broadband, unpolarized radiation with zero anisotropy. In the absence of external fields, the atomic J-levels are thus isotropically populated. While this condition persists in the presence of a magnetic field, we show instead that electric fields can induce the alignment of those levels. We also show that this electric alignment cannot occur in a two-term model of hydrogen (e.g., if only the Ly-alpha transition is excited), or if the level populations are distributed according to Boltzmann's law."}, {"id": "0705.1291", "title": "Spinodal decomposition of low-density asymmetric nuclear matter", "abstract": "We investigate the dynamical properties of asymmetric nuclear matter at low density. The occurrence of new instabilities, that lead the system to a dynamical fragment formation, is illustrated, discussing in particular the charge symmetry dependence of the structure of the most important unstable modes. We observe that instabilities are reduced by charge asymmetry, leading to larger size and time scales in the fragmentation process. Configurations with less asymmetric fragments surrounded by a more asymmetric gas are favoured. Interesting variances with respect to a pure thermodynamical prediction are revealed, that can be checked experimentally. All these features are deeply related to the structure of the symmetry term in the nuclear Equation of State (EOS) and could be used to extract information on the low density part of the EOS."}, {"id": "0704.2340", "title": "Probing the Nuclear Symmetry Energy with Heavy-Ion Reactions Induced by Neutron-Rich Nuclei", "abstract": "Heavy-ion reactions induced by neutron-rich nuclei provide a unique means to investigate the equation of state of isospin-asymmetric nuclear matter, especially the density dependence of the nuclear symmetry energy. In particular, recent analyses of the isospin diffusion data in heavy-ion reactions have already put a stringent constraint on the nuclear symmetry energy around the nuclear matter saturation density. We review this exciting result and discuss its implications on nuclear effective interactions and the neutron skin thickness of heavy nuclei. In addition, we also review the theoretical progress on probing the high density behaviors of the nuclear symmetry energy in heavy-ion reactions induced by high energy radioactive beams."}], "max_similarity": 0.7543, "skipped_llm": false, "threshold": 0.55}, {"id": "on03", "group": "on_topic", "question": "Can a uniform one-dimensional array of identical particles perform universal computations?", "answer": "Yes, a uniform one-dimensional array of identical particles can perform universal computations [1][3]. It is possible to perform universal adiabatic quantum computation using a one-dimensional quantum system with 9 states per particle [1]. Additionally, a one-dimensional quantum cellular automaton (QCA) can be intrinsically universal, meaning it can simulate all other one-dimensional QCAs [3].", "sources": [{"id": "0705.4077", "title": "The power of quantum systems on a line", "abstract": "We study the computational strength of quantum particles (each of finite dimensionality) arranged on a line. First, we prove that it is possible to perform universal adiabatic quantum computation using a one-dimensional quantum system (with 9 states per particle). This might have practical implications for experimentalists interested in constructing an adiabatic quantum computer. Building on the same construction, but with some additional technical effort and 12 states per particle, we show that the problem of approximating the ground state energy of a system composed of a line of quantum particles is QMA-complete; QMA is a quantum analogue of NP. This is in striking contrast to the fact that the analogous classical problem, namely, one-dimensional MAX-2-SAT with nearest neighbor constraints, is in P. The proof of the QMA-completeness result requires an additional idea beyond the usual techniques in the area: Not all illegal configurations can be ruled out by local checks, so instead we rule out such illegal configurations because they would, in the future, evolve into a state which can be seen locally to be illegal. Our construction implies (assuming the quantum Church-Turing thesis and that quantum computers cannot efficiently solve QMA-complete problems) that there are one-dimensional systems which take an exponential time to relax to their ground states at any temperature, making them candidates for being one-dimensional spin glasses."}, {"id": "0705.2942", "title": "Fluctuations of the one-dimensional asymmetric exclusion process using random matrix techniques", "abstract": "The studies of fluctuations of the one-dimensional Kardar-Parisi-Zhang universality class using the techniques from random matrix theory are reviewed from the point of view of the asymmetric simple exclusion process. We explain the basics of random matrix techniques, the connections to the polynuclear growth models and a method using the Green's function."}, {"id": "0704.3961", "title": "Intrinsically universal one-dimensional quantum cellular automata in two flavours", "abstract": "We give a one-dimensional quantum cellular automaton (QCA) capable of simulating all others. By this we mean that the initial configuration and the local transition rule of any one-dimensional QCA can be encoded within the initial configuration of the universal QCA. Several steps of the universal QCA will then correspond to one step of the simulated QCA. The simulation preserves the topology in the sense that each cell of the simulated QCA is encoded as a group of adjacent cells in the universal QCA. The encoding is linear and hence does not carry any of the cost of the computation. We do this in two flavours: a weak one which requires an infinite but periodic initial configuration and a strong one which needs only a finite initial configuration. KEYWORDS: Quantum cellular automata, Intrinsic universality, Quantum computation."}, {"id": "0706.0311", "title": "Universal factorized formula for the cross-section of two-particle scattering", "abstract": "We analyze the process of two-particle scattering with unstable particle in an intermediate state. It was shown that the cross-section can be represented in the universal factorized form for an arbitrary set of particles. Phenomenological analysis of factorization effect is fulfilled."}, {"id": "0705.2586", "title": "Universality in scattering by large-scale potential fluctuations in two-dimensional conductors", "abstract": "We study electron propagation through a random array of rare, opaque and large (compared the de Broglie wavelength of electrons) scatterers. It is shown that for any convex scatterer the ratio of the transport to quantum lifetimes \\eta=\\tau_{tr}/\\tau_{tot}$ does not depend on the shape of the scatterer but only on whether scattering is specular or diffuse and on the spatial dimensionality (D). In particular, for specular scattering, \\eta is a universal constant determined only by the dimensionality of the system: \\eta = 2 for D = 3 and \\eta = 3/2 for D = 2. The crossover between classical and quantum regimes of scattering is discussed."}], "max_similarity": 0.746, "skipped_llm": false, "threshold": 0.55}, {"id": "on04", "group": "on_topic", "question": "How can we find exact mathematical formulas for fluid turbulence models without external forces?", "answer": "We can find mathematical formulas for fluid turbulence models without external forces through several approaches:\n\nOne method involves creating a simple, physically transparent analytical model for pressure-driven turbulent wall-bounded flows [2]. This model can provide an accurate qualitative description of mean-velocity and Reynolds-stress profiles throughout a channel or pipe, using only three Reynolds number-independent parameters [2].\n\nAnother approach involves introducing a rotation invariant short distance cut-off in the theory of an ideal fluid in three dimensions, where momenta take values in a sphere [3]. This leads to a non-commutative algebra of functions in position space, but allows for the identification of appropriate analogues of the Euler equations, which still maintain a Hamiltonian structure [3].\n\nA third method focuses on closing the turbulence subgrid-scale stress tensor using matrix exponentials [4]. One such approach is based on a formal solution of the stress transport equation, where production terms can be integrated exactly in terms of matrix exponentials [4]. This yields a simple and local closure where the stress tensor is expressed as the product of the matrix exponential of the resolved velocity gradient tensor multiplied by its transpose [4]. This derivation can be done directly from the stress transport equation with the production term, utilizing physically motivated assumptions [4].", "sources": [{"id": "0705.3132", "title": "A Corrsin type approximation for Lagrangian fluid Turbulence", "abstract": "In Lagrangian turbulence one is faced with the puzzle that 2D Navier-Stokes flows are nearly as intermittent as in three dimensions although no intermittency is present in the inverse cascade in 2D Eulerian turbulence. In addition, an inertial range is very difficult to detect and it is questionable whether it exists at all. Here, we investigate the transition of Eulerian to Lagrangian probability density functions (PDFs) which leads to a new type of Lagrangian structure function. This possesses an extended inertial range similar to the case of tracer particles in a frozen turbulent velocity field. This allows a connection to the scaling of Eulerian transversal structure functions."}, {"id": "0705.4592", "title": "Universal Model of Finite-Reynolds Number Turbulent Flow in Channels and Pipes", "abstract": "In this Letter we suggest a simple and physically transparent analytical model of the pressure driven turbulent wall-bounded flows at high but finite Reynolds numbers Re. The model gives accurate qualitative description of the profiles of the mean-velocity and Reynolds-stresses (second order correlations of velocity fluctuations) throughout the entire channel or pipe in the wide range of Re, using only three Re-independent parameters. The model sheds light on the long-standing controversy between supporters of the century-old log-law theory of von-K\\`arm\\`an and Prandtl and proposers of a newer theory promoting power laws to describe the intermediate region of the mean velocity profile."}, {"id": "0705.2139", "title": "Fuzzy Fluid Mechanics in Three Dimensions", "abstract": "We introduce a rotation invariant short distance cut-off in the theory of an ideal fluid in three space dimensions, by requiring momenta to take values in a sphere. This leads to an algebra of functions in position space is non-commutative. Nevertheless it is possible to find appropriate analogues of the Euler equations of an ideal fluid. The system still has a hamiltonian structure. It is hoped that this will be useful in the study of possible singularities in the evolution of Euler (or Navier-Stokes) equations in three dimensions."}, {"id": "0704.3781", "title": "Matrix Exponential-Based Closures for the Turbulent Subgrid-Scale Stress Tensor", "abstract": "Two approaches for closing the turbulence subgrid-scale stress tensor in terms of matrix exponentials are introduced and compared. The first approach is based on a formal solution of the stress transport equation in which the production terms can be integrated exactly in terms of matrix exponentials. This formal solution of the subgrid-scale stress transport equation is shown to be useful to explore special cases, such as the response to constant velocity gradient, but neglecting pressure-strain correlations and diffusion effects. The second approach is based on an Eulerian-Lagrangian change of variables, combined with the assumption of isotropy for the conditionally averaged Lagrangian velocity gradient tensor and with the `Recent Fluid Deformation' (RFD) approximation. It is shown that both approaches lead to the same basic closure in which the stress tensor is expressed as the product of the matrix exponential of the resolved velocity gradient tensor multiplied by its transpose. Short-time expansions of the matrix exponentials are shown to provide an eddy-viscosity term and particular quadratic terms, and thus allow a reinterpretation of traditional eddy-viscosity and nonlinear stress closures. The basic feasibility of the matrix-exponential closure is illustrated by implementing it successfully in Large Eddy Simulation of forced isotropic turbulence. The matrix-exponential closure employs the drastic approximation of entirely omitting the pressure-strain correlation and other `nonlinear scrambling' terms. But unlike eddy-viscosity closures, the matrix exponential approach provides a simple and local closure that can be derived directly from the stress transport equation with the production term, and using physically motivated assumptions about Lagrangian decorrelation and upstream isotropy."}, {"id": "0704.1810", "title": "A Cascade Model for Particle Concentration and Enstrophy in Fully Developed Turbulence with Mass Loading Feedback", "abstract": "A cascade model is described based on multiplier distributions determined from 3D direct numerical simulations (DNS) of turbulent particle laden flows, which include two-way coupling between the phases at global mass loadings equal to unity. The governing Eulerian equations are solved using pseudo-spectral methods on up to 512**3 computional grid points. DNS results for particle concentration and enstrophy at Taylor microscale Reynolds numbers in the range 34 - 170 were used to directly determine multiplier distributions (PDFs) on spatial scales 3 times the Kolmogorov length scale. The width of the PDFs, which is a measure of intermittency, decreases with increasing mass loading within the local region where the multipliers are measured. The functional form of this dependence is not sensitive to Reynolds numbers in the range considered. A partition correlation probability is included in the cascade model to account for the observed spatial anticorrelation between particle concentration and enstrophy. Joint probability distribution functions of concentration and enstrophy generated using the cascade model are shown to be in excellent agreement with those derived directly from our 3D simulations. Probabilities predicted by the cascade model are presented at Reynolds numbers well beyond what is achievable by direct simulation. These results clearly indicate that particle mass loading significantly reduces the probabilities of high particle concentration and enstrophy relative to those resulting from unloaded runs. Particle mass density appears to reach a limit at around 100 times the gas density. This approach has promise for significant computational savings in certain applications."}], "max_similarity": 0.7645, "skipped_llm": false, "threshold": 0.55}, {"id": "on05", "group": "on_topic", "question": "How can charge conjugation parity violation be added to fermion mass generation frameworks?", "answer": "The available papers do not contain sufficient information on how charge conjugation parity violation can be added to fermion mass generation frameworks. While one paper discusses electric dipole moments arising from CKM phases and R-parity violating parameters, which are related to CP violation and quark-scalar loop contributions [3], it does not detail how CP violation is added to the general framework of fermion mass generation.", "sources": [{"id": "0704.2618", "title": "Testing the Standard Model by precision measurement of the weak charges of quarks", "abstract": "In a global analysis of the latest parity-violating electron scattering measurements on nuclear targets, we demonstrate a significant improvement in the experimental knowledge of the weak neutral-current lepton-quark interactions at low energy. The precision of this new result, combined with earlier atomic parity-violation measurements, places tight constraints on the size of possible contributions from physics beyond the Standard Model. Consequently, this result improves the lower-bound on the scale of relevant new physics to ~1 TeV."}, {"id": "0706.1027", "title": "Parity nonconservation in dielectronic recombination of multiply charged ions", "abstract": "We discuss a parity nonconserving (PNC) asymmetry in the cross section of dielectronic recombination of polarized electrons on multiply charged ions with Z>40. This effect is strongly enhanced for close doubly-excited states of opposite parity in the intermediate compound ion. Such states are known for He-like ions. However, these levels have large energy and large radiative widths which hampers observation of the PNC asymmetry. We argue that accidentally degenerate states of the more complex ions may be more suitable for the corresponding experiment."}, {"id": "0705.3939", "title": "Quark Loop Contributions to Neutron, Deuteron, and Mercury EDMs from Supersymmetry without R parity", "abstract": "We present a detailed analysis of the neutron, deuteron and mercury electric dipole moment from supersymmetry without R parity, focusing on the quark-scalar loop contributions. Being proportional to top Yukawa and top mass, such contributions are often large. Analytical expressions illustrating the explicit role of the R-parity violating parameters are given following perturbative diagonalization of mass-squared matrices for the scalars. Dominant contributions come from the combinations $B_i \\lambda^{\\prime}_{ij1}$ for which we obtain robust bounds. It turns out that neutron and deuteron EDMs receive much stronger contributions than mercury EDM and any null result at the future deuteron EDM experiment or Los Alamos neutron EDM experiment can lead to extra-ordinary constraints on RPV parameter space. Even if R-parity violating couplings are real, CKM phase does induce RPV contribution and for some cases such a contribution is as strong as contribution from phases in the R-parity violating couplings.Hence, we have bounds directly on $|B_i \\lambda^{\\prime}_{ij1}|$ even if the RPV parameters are all real. Interestingly, even if slepton mass and/or $\\mu_0$ is as high as 1 TeV, it still leads to neutron EDM that is an order of magnitude larger than the sensitivity at Los Alamos experiment. Since the results are not much sensitive to $\\tan \\beta$, our constraints will survive even if other observables tighten the constraints on $\\tan \\beta$."}, {"id": "0704.3186", "title": "On the dynamical mass generation in confining Yang-Mills theories", "abstract": "The dynamical mass generation for gluons is discussed in Euclidean Yang-Mills theories supplemented with a renormalizable mass term. The mass parameter is not free, being determined in a self-consistent way through a gap equation which obeys the renormalization group. The example of the Landau gauge is worked out explicitly at one loop order. A few remarks on the issue of the unitarity are provided."}, {"id": "0705.4392", "title": "Finite-Mass Effects on Inclusive B-Meson Hadroproduction", "abstract": "We calculate the transverse-momentum (p_T) distribution for the inclusive hadroproduction of B mesons at intermediate values of p_T at next-to-leading order (NLO) in a dedicated finite-mass scheme using realistic non-perturbative fragmentation functions that are obtained through a global fit to e^+e^- data from CERN LEP1 and SLAC SLC exploiting their universality and scaling violations. We find that finite-mass effects moderately enhance the cross section, by about 20% at p_T = 2 m_b, and rapidly fade out with increasing value of p_T, so that the zero-mass prediction is reached. We also perform comparisons with recent ppbar data taken by the CDF Collaboration in run II at the Fermilab Tevatron and comment on the usefulness of the fixed-flavor-number scheme."}], "max_similarity": 0.7493, "skipped_llm": false, "threshold": 0.55}, {"id": "on06", "group": "on_topic", "question": "How can we calculate the decay rates for rare fluctuation tails in random media partition functions?", "answer": "Based on the provided papers, a method to obtain estimates on the rate of decay of the lower tail of large deviations (which are sharp up to multiplicative constants) for the partition function of a directed polymer in an IID field is provided in [1]. This method is simple to apply and can also be used for other oriented and non-oriented models, including first/last-passage percolation and the parabolic Anderson model [1]. Additionally, to study the tails of the free energy distribution function for an elastic string in a quenched disorder (random medium), a modification of the optimal fluctuation approach can be applied [3].", "sources": [{"id": "0704.3758", "title": "Large Deviations for Partition Functions of Directed Polymers and Some Other Models in an IID Field", "abstract": "Consider the partition function of a directed polymer in an IID field. We assume that both tails of the negative and the positive part of the field are at least as light as exponential. It is a well-known fact that the free energy of the polymer is equal to a deterministic constant for almost every realization of the field and that the upper tail of the large deviations is exponential. The lower tail of the large deviations is typically lighter than exponential. In this paper we provide a method to obtain estimates on the rate of decay of the lower tail of the large deviations, which are sharp up to multiplicative constants. As a consequence, we show that the lower tail of the large deviations exhibits three regimes, determined according to the tail of the negative part of the field. Our method is simple to apply and can be used to cover other oriented and non-oriented models including first/last-passage percolation and the parabolic Anderson model"}, {"id": "0706.0913", "title": "Zipf's law in Nuclear Multifragmentation and Percolation Theory", "abstract": "We investigate the average sizes of the $n$ largest fragments in nuclear multifragmentation events near the critical point of the nuclear matter phase diagram. We perform analytic calculations employing Poisson statistics as well as Monte Carlo simulations of the percolation type. We find that previous claims of manifestations of Zipf's Law in the rank-ordered fragment size distributions are not born out in our result, neither in finite nor infinite systems. Instead, we find that Zipf-Mandelbrot distributions are needed to describe the results, and we show how one can derive them in the infinite size limit. However, we agree with previous authors that the investigation of rank-ordered fragment size distributions is an alternative way to look for the critical point in the nuclear matter diagram."}, {"id": "0704.1705", "title": "Optimal fluctuation approach to a directed polymer in a random medium", "abstract": "A modification of the optimal fluctuation approach is applied to study the tails of the free energy distribution function P(F) for an elastic string in quenched disorder both in the regions of the universal behavior of P(F) and in the regions of large fluctuations, where the behavior of P(F) is non-universal. The difference between the two regimes is shown to consist in whether it is necessary or not to take into account the renormalization of parameters by the fluctuations of disorder in the vicinity of the optimal fluctuation."}, {"id": "0705.0678", "title": "Bimodality in spectator fragmentation", "abstract": "The fluctuations of the largest fragment charge of a partition and of the charge asymmetries of the two or three largest fragments in spectator decays following 197Au + 197Au collisions at 1000 MeV per nucleon are investigated. The observed bimodal distributions at specific values of the sorting variable Z_bound exhibit features known from percolation theory where they appear as finite-size effects. The underlying configurational fluctuations seem generic for fragmentation processes in small systems."}, {"id": "0706.0043", "title": "A perturbation theory for large deviation functionals in fluctuating hydrodynamics", "abstract": "We study a large deviation functional of density fluctuation by analyzing stochastic non-linear diffusion equations driven by the difference between the densities fixed at the boundaries. By using a fundamental equality that yields the fluctuation theorem, we first relate the large deviation functional with a minimization problem. We then develop a perturbation method for solving the problem. In particular, by performing an expansion with respect to the average current, we derive the lowest order expression for the deviation from the local equilibrium part. This expression implies that the deviation is written as the space-time integration of the excess entropy production rate during the most probable process of generating the fluctuation that corresponds to the argument of the large deviation functional."}], "max_similarity": 0.7683, "skipped_llm": false, "threshold": 0.55}, {"id": "on07", "group": "on_topic", "question": "How can hadron-photon correlations isolate specific radiation components in nuclear collisions?", "answer": "Based on the provided research papers, hadron-photon correlations can be used to select photons associated with jets on the near side, which allows fragmentation photons to be measured directly [4].", "sources": [{"id": "0705.1977", "title": "Correlations with Photons in Heavy-Ion Collisions", "abstract": "We present a study of two-particle correlation functions involving photons and neutral pions in proton-proton and lead-lead collisions at the LHC energy. The aim is to use these correlation functions to quantify the effects of the medium on the jet decay properties."}, {"id": "0705.3073", "title": "A Parton-Based Description of Forward-Backward Correlation in pp Collisions", "abstract": "Forward-backward correlation in pp collisions is studied in an approach that emphasizes the partonic scattering angles and circumvents the intractable problem related to the transverse momenta that are low. Assuming the back-to-back scattering of partons to be the origin of hadronic correlation, the properties of forward-backward multiplicity covariance can be derived essentially independent of details of hadronization. The range of correlation in pseudo-rapidity emerges from the study without any dynamical input, thus dispelling the notion that correlation length has any fundamental significance. An attempt is made to relate the results to the two-component structure seen in autocorrelation."}, {"id": "0705.0842", "title": "PHENIX Measurement of High-$p_T$ Hadron-hadron and Photon-hadron Azimuthal Correlations", "abstract": "High-$p_T$ hadron-hadron correlations have been measured with the PHENIX experiment in $\\Cu$ and $\\pp$ collisions at $\\sqrt{s_{NN}}=200$ GeV. A comparison of the jet widths and yields between the two colliding systems allows us to study the medium effect on jets. We also present a first measurement of direct photon-hadron correlations in $\\Au$ and $\\pp$ collisions. We find that the near-side yields are consistent with zero in both systems. By comparing the jet yields on the away side, we observe a suggestion of the expected suppression of hadrons associated with photons in $\\Au$ collisions."}, {"id": "0705.0526", "title": "Measuring Bremsstrahlung Photons in 200 GeV p+p Collisions", "abstract": "Direct photon production is an important observable in heavy ion collisions as photons are penetrating and therefore largely insensetive to final state effects that lead to jet quenching. Measurements of the fragmentation component to prompt photon yields in p+p and Au+Au collisions will provide both an important test of pQCD predictions and of predictions for modifications of this component in heavy ion collisions. By selecting photons associated with jets on the near side using hadron-photon correlations, fragmentation photons can be measured directly."}, {"id": "0704.2158", "title": "Photon-jet correlations in $pp$ and $p \\bar p$ collisions", "abstract": "We compare results of the $k_t$-factorization approach and the next-to-leading order collinear-factorization approach for photon-jet correlations in $pp$ and $p \\bar p$ collisions at RHIC and Tevatron energies. We discuss correlations in the azimuthal angle as well as in the two-dimensional space of transverse momentum of photon and jet. Different unintegrated parton distributions (UPDF) are included in the $k_t$-factorization approach. The results depend on UPDFs used. The standard collinear approach gives cross section comparable to the $k_t$-factorization approach. For correlations of the photon and any jet the NLO contributions dominate at relatively small azimuthal angles as well as for asymmetric transverse momenta. For correlations of the photon with the leading jet (the one having the biggest transverse momentum) the NLO approach gives zero contribution at $\\phi_{-} < \\pi/2$ which opens a possibility to study higher-order terms and/or UPDFs in this region."}], "max_similarity": 0.8135, "skipped_llm": false, "threshold": 0.55}, {"id": "on08", "group": "on_topic", "question": "What happens during high-energy atomic nuclei impacts according to updated microscopic simulations?", "answer": "The available papers do not contain sufficient information to answer what happens during high-energy atomic nuclei impacts according to updated microscopic simulations (Paper [1] describes a Quantum Molecular Dynamics model applied to non-relativistic bombarding energies within 200–600 MeV/A).", "sources": [{"id": "0704.3917", "title": "A fully microscopical simulation of nuclear collisions by a new QMD model", "abstract": "Nucleon-ion and ion-ion collisions at non relativistic bombarding energies can be described by means of Monte Carlo approaches, such as those based on the Quantum Molecular Dynamics (QMD) model. We have developed a QMD code, to simulate the fast stage of heavy-ion reactions, and we have coupled it to the de-excitation module available in the FLUKA Monte Carlo transport and interaction code. The results presented in this work span the projectile bombarding energy range within 200 - 600 MeV/A, allowing to investigate the capabilities and limits of our non-relativistic QMD approach."}, {"id": "0705.3047", "title": "Nuclear enhancement of universal dynamics of high parton densities", "abstract": "We show that the enhancement of the saturation scale in large nuclei relative to the proton is significantly influenced by the effects of quantum evolution and the impact parameter dependence of dipole cross sections in high energy QCD. We demonstrate that there is a strong A dependence in diffractive deeply inelastic scattering and discuss its sensitivity to the measurement of the recoil nucleus."}, {"id": "0705.2387", "title": "Nucleon-induced fission cross-sections of tantalum and separated tungsten isotopes and \"compound nucleus\" effect in intermediate energy region", "abstract": "Neutron- and proton-induced fission cross-sections of separated isotopes of tungsten (182W, 183W, 184W, and 186W) and 181Ta relative to 209Bi have been measured in the incident nucleon energy region 50 - 200 MeV using fission chambers based on thin-film breakdown counters (TFBC) using quasi-monoenergetic neutrons from the 7Li(p,n) reaction and at the proton beams of The Svedberg Laboratory (TSL), Uppsala University (Uppsala, Sweden). The results are compared with predictions by the CEM03.01 event generator, as well as with the recent data for nuclei in the lead-bismuth region. The effect of \"compound nucleus\" in the intermediate energy region is discussed, displaying in exponential dependence of nucleon-induced fission cross-sections on the parameter Z^2/A of the composite system (projectile+target nucleus), and in other characteristics of the fission process for which parameter Z^2/A plays a role similar to the one of the usual liquid-drop parameter Z^2/A of compound nuclei."}, {"id": "0705.4265", "title": "Retrieving Nuclear Information from Protons Propagating through A Thick Target", "abstract": "The multiple scattering of high-energy particles in a thick target is fromulated in an impact parameter representation. A formalism similar but not identical to that of Moliere is obtained. We show that calculations of particle beam broadening due to multiple Coulomb scattering alone can be given in closed form. The focus of this study is on whether or not the broadening of the Coulomb angular distribution prevents the retrieval of nuclear-interaction information from mesauring the angular distributions of charged partiles scattered from a thick target. For this purpose, we study multiple scatterings with both the nuclear and Coulomb interactions included and we do not make a small-angle expansion. Condition for retrieving nuclear infomration from high-energy protons propagating through a block of material are obtained."}, {"id": "0706.0467", "title": "Effects of geometric constraints on the nuclear multifragmentation process", "abstract": "We include in statistical model calculations the facts that in the nuclear multifragmentation process the fragments are produced within a given volume and have a finite size. The corrections associated with these constraints affect the partition modes and, as a consequence, other observables in the process. In particular, we find that the favored fragmenting modes strongly suppress the collective flow energy, leading to much lower values compared to what is obtained from unconstrained calculations. This leads, for a given total excitation energy, to a nontrivial correlation between the breakup temperature and the collective expansion velocity. In particular we find that, under some conditions, the temperature of the fragmenting system may increase as a function of this expansion velocity, contrary to what it might be expected."}], "max_similarity": 0.773, "skipped_llm": false, "threshold": 0.55}, {"id": "on09", "group": "on_topic", "question": "Which machine learning approach works better for predicting municipal fluid consumption rates?", "answer": "The available papers do not contain sufficient information to answer which machine learning approach works better for predicting municipal fluid consumption rates. (Note: While paper [1] discusses comparing Artificial Neural Networks and Support Vector Machines for water demand forecasting, and paper [5] discusses river flow data, none of the papers specifically mention municipal fluid consumption rates.)", "sources": [{"id": "0705.0969", "title": "Artificial Neural Networks and Support Vector Machines for Water Demand Time Series Forecasting", "abstract": "Water plays a pivotal role in many physical processes, and most importantly in sustaining human life, animal life and plant life. Water supply entities therefore have the responsibility to supply clean and safe water at the rate required by the consumer. It is therefore necessary to implement mechanisms and systems that can be employed to predict both short-term and long-term water demands. The increasingly growing field of computational intelligence techniques has been proposed as an efficient tool in the modelling of dynamic phenomena. The primary objective of this paper is to compare the efficiency of two computational intelligence techniques in water demand forecasting. The techniques under comparison are the Artificial Neural Networks (ANNs) and the Support Vector Machines (SVMs). In this study it was observed that the ANNs perform better than the SVMs. This performance is measured against the generalisation ability of the two."}, {"id": "0706.1051", "title": "Improved Neural Modeling of Real-World Systems Using Genetic Algorithm Based Variable Selection", "abstract": "Neural network models of real-world systems, such as industrial processes, made from sensor data must often rely on incomplete data. System states may not all be known, sensor data may be biased or noisy, and it is not often known which sensor data may be useful for predictive modelling. Genetic algorithms may be used to help to address this problem by determining the near optimal subset of sensor variables most appropriate to produce good models. This paper describes the use of genetic search to optimize variable selection to determine inputs into the neural network model. We discuss genetic algorithm implementation issues including data representation types and genetic operators such as crossover and mutation. We present the use of this technique for neural network modelling of a typical industrial application, a liquid fed ceramic melter, and detail the results of the genetic search to optimize the neural network model for this application."}, {"id": "0705.0209", "title": "Support vector machine for functional data classification", "abstract": "In many applications, input data are sampled functions taking their values in infinite dimensional spaces rather than standard vectors. This fact has complex consequences on data analysis algorithms that motivate modifications of them. In fact most of the traditional data analysis tools for regression, classification and clustering have been adapted to functional inputs under the general name of functional Data Analysis (FDA). In this paper, we investigate the use of Support Vector Machines (SVMs) for functional data analysis and we focus on the problem of curves discrimination. SVMs are large margin classifier tools based on implicit non linear mappings of the considered data into high dimensional spaces thanks to kernels. We show how to define simple kernels that take into account the unctional nature of the data and lead to consistent classification. Experiments conducted on real world data emphasize the benefit of taking into account some functional aspects of the problems."}, {"id": "0704.1274", "title": "Parametric Learning and Monte Carlo Optimization", "abstract": "This paper uncovers and explores the close relationship between Monte Carlo Optimization of a parametrized integral (MCO), Parametric machine-Learning (PL), and `blackbox' or `oracle'-based optimization (BO). We make four contributions. First, we prove that MCO is mathematically identical to a broad class of PL problems. This identity potentially provides a new application domain for all broadly applicable PL techniques: MCO. Second, we introduce immediate sampling, a new version of the Probability Collectives (PC) algorithm for blackbox optimization. Immediate sampling transforms the original BO problem into an MCO problem. Accordingly, by combining these first two contributions, we can apply all PL techniques to BO. In our third contribution we validate this way of improving BO by demonstrating that cross-validation and bagging improve immediate sampling. Finally, conventional MC and MCO procedures ignore the relationship between the sample point locations and the associated values of the integrand; only the values of the integrand at those locations are considered. We demonstrate that one can exploit the sample location information using PL techniques, for example by forming a fit of the sample locations to the associated values of the integrand. This provides an additional way to apply PL techniques to improve MCO."}, {"id": "0704.0302", "title": "Spline Single-Index Prediction Model", "abstract": "For the past two decades, single-index model, a special case of projection pursuit regression, has proven to be an efficient way of coping with the high dimensional problem in nonparametric regression. In this paper, based on weakly dependent sample, we investigate the single-index prediction (SIP) model which is robust against deviation from the single-index model. The single-index is identified by the best approximation to the multivariate prediction function of the response variable, regardless of whether the prediction function is a genuine single-index function. A polynomial spline estimator is proposed for the single-index prediction coefficients, and is shown to be root-n consistent and asymptotically normal. An iterative optimization routine is used which is sufficiently fast for the user to analyze large data of high dimension within seconds. Simulation experiments have provided strong evidence that corroborates with the asymptotic theory. Application of the proposed procedure to the rive flow data of Iceland has yielded superior out-of-sample rolling forecasts."}], "max_similarity": 0.777, "skipped_llm": false, "threshold": 0.55}, {"id": "on10", "group": "on_topic", "question": "What function generates specific sequences of discrete polynomials tied to Pascal probability distributions?", "answer": "A generating function is obtained for the $\\Delta$--Meixner--Sobolev orthogonal polynomials, which are associated with the Pascal distribution (since the orthogonal polynomials for this distribution are known as Meixner polynomials) [1].", "sources": [{"id": "0706.0551", "title": "A generating function for non-standard orthogonal polynomials involving differences: the Meixner case", "abstract": "In this paper we deal with a family of non--standard polynomials orthogonal with respect to an inner product involving differences. This type of inner product is the so--called $\\Delta$--Sobolev inner product. Concretely, we consider the case in which both measures appearing in the inner product correspond to the Pascal distribution (the orthogonal polynomials associated to this distribution are known as Meixner polynomials). The aim of this work is to obtain a generating function for the $\\Delta$--Meixner--Sobolev orthogonal polynomials and, by using a limit process, recover a generating function for Laguerre--Sobolev orthogonal polynomials."}, {"id": "0706.0333", "title": "The characteristic polynomial of a random unitary matrix: a probabilistic approach", "abstract": "In this paper, we propose a probabilistic approach to the study of the characteristic polynomial of a random unitary matrix. We recover the Mellin Fourier transform of such a random polynomial, first obtained by Keating and Snaith, using a simple recursion formula, and from there we are able to obtain the joint law of its radial and angular parts in the complex plane. In particular, we show that the real and imaginary parts of the logarithm of the characteristic polynomial of a random unitary matrix can be represented in law as the sum of independent random variables. From such representations, the celebrated limit theorem obtained by Keating and Snaith is now obtained from the classical central limit theorems of Probability Theory, as well as some new estimates for the rate of convergence and law of the iterated logarithm type results."}, {"id": "0706.0570", "title": "Weighted lattice polynomials", "abstract": "We define the concept of weighted lattice polynomial functions as lattice polynomial functions constructed from both variables and parameters. We provide equivalent forms of these functions in an arbitrary bounded distributive lattice. We also show that these functions include the class of discrete Sugeno integrals and that they are characterized by a median based decomposition formula."}, {"id": "0706.0356", "title": "A class of series acceleration formulae for Catalan's constant", "abstract": "In this note, we develop transformation formulae and expansions for the log tangent integral, which are then used to derive series acceleration formulae for certain values of Dirichlet L-functions, such as Catalan's constant. The formulae are characterized by the presence of an infinite series whose general term consists of a linear recurrence damped by the central binomial coefficient and a certain quadratic polynomial. Typically, the series can be expressed in closed form as a rational linear combination of Catalan's constant and pi times the logarithm of an algebraic unit."}, {"id": "0704.2586", "title": "Distributions of Roots of Reduced Cubic Equations with Random Coefficients", "abstract": "If the coefficients of polynomials are selected by some random process, the zeros of the resulting polynomials are in some sense random. In this paper the author rephrases the above in more precise language, and calculates the joint conditional densities of a random vector whose values determine almost surely the zeros of a \"random\" reduced cubic."}], "max_similarity": 0.7517, "skipped_llm": false, "threshold": 0.55}, {"id": "on11", "group": "on_topic", "question": "What symmetry properties characterize hypersurfaces embedded squarely within Euclidean space?", "answer": "Based on the provided papers, compact Euclidean rotation hypersurfaces of dimension $n \\geq 3$ are characterized by their underlying warped product structure [1]. \n\nAdditionally, given an isometric immersion $f\\colon M^n\\to \\R^{n+1}$ of a compact Riemannian manifold of dimension $n\\geq 3$ into Euclidean space, the identity component $Iso^0(M^n)$ of its isometry group admits an orthogonal representation $\\Phi\\colon Iso^0(M^n)\\to SO(n+1)$ such that $f\\circ g=\\Phi(g)\\circ f$ for every $g\\in Iso^0(M^n)$ [1]. If a closed connected subgroup $G$ of $Iso(M^n)$ acts locally polarly on $M^n$, then $\\Phi(G)$ acts polarly on $\\R^{n+1}$, and $f(M^n)$ is given as $\\Phi(G)(L)$, where $L$ is a hypersurface of a section invariant under the Weyl group of the $\\Phi(G)$-action [1].", "sources": [{"id": "0704.1807", "title": "Polar actions on compact Euclidean hypersurfaces", "abstract": "Given an isometric immersion $f\\colon M^n\\to \\R^{n+1}$ of a compact Riemannian manifold of dimension $n\\geq 3$ into Euclidean space of dimension $n+1$, we prove that the identity component $Iso^0(M^n)$ of the isometry group $Iso(M^n)$ of $M^n$ admits an orthogonal representation $\\Phi\\colon Iso^0(M^n)\\to SO(n+1)$ such that $f\\circ g=\\Phi(g)\\circ f$ for every $g\\in Iso^0(M^n)$. If $G$ is a closed connected subgroup of $Iso(M^n)$ acting locally polarly on $M^n$, we prove that $\\Phi(G)$ acts polarly on $\\R^{n+1}$, and we obtain that $f(M^n)$ is given as $\\Phi(G)(L)$, where $L$ is a hypersurface of a section which is invariant under the Weyl group of the $\\Phi(G)$-action. We also find several sufficient conditions for such an $f$ to be a rotation hypersurface. Finally, we show that compact Euclidean rotation hypersurfaces of dimension $n\\geq 3$ are characterized by their underlying warped product structure."}, {"id": "0705.0291", "title": "Properties of B\\\"or\\\"oczki tilings in high dimensional hyperbolic spaces", "abstract": "We consider families of B\\\"or\\\"oczky tilings in hyperbolic space in arbitrary dimension, study some basic properties and classify all possible symmetries. In particular, it is shown that these tilings are non-crystallographic, and that there are uncountably many tilings with a fixed prototile."}, {"id": "0705.0694", "title": "On Lagrangian submanifolds in complex hyperquadrics and isoparametric hypersurfaces in spheres", "abstract": "The $n$-dimensional complex hyperquadric is a compact complex algebraic hypersurface defined by the quadratic equation in the $(n+1)$-dimensional complex projective space, which is isometric to the real Grassmann manifold of oriented 2- planes and is a compact Hermitian symmetric space of rank 2. In this paper we study geometry of compact Lagrangian submanifolds in complex hyperquadrics from the viewpoint of the theory of isoparametric hypersurfaces in spheres. From this viewpoint we provide a classification theorem of compact homogeneous Lagrangian submanifolds in complex hyperquadrics by using the moment map technique. Moreover we determine the Hamiltonian stability of compact minimal Lagrangian submanifolds embedded in complex hyperquadrics which are obtained as Gauss images of isoparametric hypersurfaces in spheres with $g(=1,2,3)$ distinct principal curvatures."}, {"id": "0704.0052", "title": "Quantum Field Theory on Curved Backgrounds. II. Spacetime Symmetries", "abstract": "We study space-time symmetries in scalar quantum field theory (including interacting theories) on static space-times. We first consider Euclidean quantum field theory on a static Riemannian manifold, and show that the isometry group is generated by one-parameter subgroups which have either self-adjoint or unitary quantizations. We analytically continue the self-adjoint semigroups to one-parameter unitary groups, and thus construct a unitary representation of the isometry group of the associated Lorentzian manifold. The method is illustrated for the example of hyperbolic space, whose Lorentzian continuation is Anti-de Sitter space."}, {"id": "0704.1363", "title": "Spectra and symmetric eigentensors of the Lichnerowicz Laplacian on $S^n$", "abstract": "We compute the eigenvalues with multiplicities of the Lichnerowicz Laplacian acting on the space of symmetric covariant tensor fields on the Euclidian sphere $S^n$. The spaces of symmetric eigentensors are explicitly given."}], "max_similarity": 0.7661, "skipped_llm": false, "threshold": 0.55}, {"id": "on12", "group": "on_topic", "question": "How do we calculate probability amplitudes for evolving cosmological geometries in string theory?", "answer": "The available papers do not contain sufficient information to answer how to calculate probability amplitudes for evolving cosmological geometries in string theory.", "sources": [{"id": "0705.2034", "title": "Stochastic approach of gravitational waves in presence of a decaying cosmological parameter from a 5D vacuum theory of gravity", "abstract": "We develop an stochastic approach to study gravitational waves produced during the inflationary epoch under the presence of a decaying cosmological parameter, on a 5D geometrical background which is Riemann flat. We obtain that the squared tensor metric fluctuations depend strongly on the cosmological parameter $\\Lambda (t)$ and we finally illustrate the formalism with an example of a decaying $\\Lambda(t)$."}, {"id": "0704.0647", "title": "Testing String Theory with CMB", "abstract": "Future detection/non-detection of tensor modes from inflation in CMB observations presents a unique way to test certain features of string theory. Current limit on the ratio of tensor to scalar perturbations, r=T/S, is r < 0.3, future detection may take place for r > 10^{-2}-10^{-3}. At present all known string theory inflation models predict tensor modes well below the level of detection. Therefore a possible experimental discovery of tensor modes may present a challenge to string cosmology. The strongest bound on r in string inflation follows from the observation that in most of the models based on the KKLT construction, the value of the Hubble constant H during inflation must be smaller than the gravitino mass. For the gravitino mass in the usual range, m_{3/2} < O(1) TeV, this leads to an extremely strong bound r < 10^{-24}. A discovery of tensor perturbations with r > 10^{-3} would imply that the gravitinos in this class of models are superheavy, m_{3/2} > 10^{13} GeV. This would have important implications for particle phenomenology based on string theory."}, {"id": "0705.3395", "title": "Velocity-Dependent Models for Non-Abelian/Entangled String Networks", "abstract": "We develop velocity-dependent models describing the evolution of string networks that involve several types of interacting strings, each with a different tension. These incorporate the formation of Y-type junctions with links stretching between colliding strings, while always ensuring energy conservation. These models can be used to describe network evolution for non-abelian strings as well as cosmic superstrings. The application to $Z_{N}$ strings in which interactions are topologically constrained, demonstrates that a scaling regime is generally reached which involves a hierarchy of string densities with the lightest most abundant. We also study hybrid networks of cosmic superstrings, where energetic considerations are more important in determining interaction outcomes. We again find that networks tend towards scaling, with the three lightest network components being dominant and having comparable number densities, while the heavier string states are suppressed. A more quantitative analysis depends on the precise calculation of the string interaction matrix using the underlying string or field theory. Nevertheless, these results provide further evidence that the presence of junctions in a string network does not obstruct scaling."}, {"id": "0705.3043", "title": "Route to nonlocal cosmology", "abstract": "An analytic approach to phenomenological models inspired by cubic string field theory is introduced and applied to some examples. We study a class of actions for a minimally coupled, homogeneous scalar field whose energy density contains infinitely many time derivatives. These nonlocal systems are systematically localized and an algorithm to find cosmological solutions of the dynamical equations is provided. Our formalism is able to define the nonlocal field in regions of the parameter space which are inaccessible by standard methods. Also, problems related to nonlocality are reinterpreted under a novel perspective and naturally overcome. We consider phenomenological models living on a Friedmann-Robertson-Walker background with power-law scale factor, both in four dimensions and on a high-energy braneworld. The quest for solutions unravels general features of nonlocal dynamics indicating several future directions of investigation."}, {"id": "0705.2113", "title": "Scattering amplitudes in strongly coupled N=4 SYM from semiclassical strings in AdS", "abstract": "Very recently in arXiv:0705.0303 Alday and Maldacena gave a string theory prescription for computing (all) planar amplitudes in N=4 supersymmetric gauge theory at strong coupling using the AdS/CFT correspondence. These amplitudes are determined by a classical string solution and contain a universal exponential factor involving the action of the classical string. On the gauge theory side, expressions for perturbative amplitudes at strong coupling were previously proposed only for specific helicities of external particles -- the maximally helicity violating or MHV amplitudes. These follow from the exponential ansatz of Bern, Dixon and Smirnov for MHV amplitudes in N=4 SYM. In this paper we examine the amplitudes dependence on helicities and particle-types of external states. We consider the prefactor of string amplitudes and give arguments suggesting that the prefactor at strong coupling should be the same as the Yang-Mills tree-level amplitude for the same process. This implies that scattering amplitudes in N=4 SYM simplify dramatically in the strong coupling limit. It follows from our proposal that in this limit all (MHV and non-MHV) n-point amplitudes are given by the (known) tree-level Yang-Mills result times the helicity-independent (and particle-type-independent) universal exponential."}], "max_similarity": 0.803, "skipped_llm": false, "threshold": 0.55}, {"id": "on13", "group": "on_topic", "question": "Can soft computing models successfully evaluate insulation health using dissolved oil testing standards?", "answer": "Yes, soft computing models can successfully evaluate insulation health using dissolved gas analysis (DGA) data based on established standards. Specifically:\n\n* Dissolved gas analysis (DGA) data based on standards such as IEEEc57.104, IEC599, and IEEE production rates for oil-impregnated paper (OIP) bushings are used to classify and evaluate bushing conditions using neural networks combined with evolutionary computing (particle swarm optimization and genetic algorithms) [3].\n* DGA data based on IEC60599 and IEEE C57-104 criteria for OIP bushings are similarly used with fuzzy set theory and neural networks to diagnose bushing conditions [4].\n* Furthermore, bushing condition monitoring frameworks analyze diagnostic gases using dissolved gas analysis via classifiers such as multi-layer perceptrons, radial basis functions, and support vector machines [1].", "sources": [{"id": "0705.2310", "title": "On-Line Condition Monitoring using Computational Intelligence", "abstract": "This paper presents bushing condition monitoring frameworks that use multi-layer perceptrons (MLP), radial basis functions (RBF) and support vector machines (SVM) classifiers. The first level of the framework determines if the bushing is faulty or not while the second level determines the type of fault. The diagnostic gases in the bushings are analyzed using the dissolve gas analysis. MLP gives superior performance in terms of accuracy and training time than SVM and RBF. In addition, an on-line bushing condition monitoring approach, which is able to adapt to newly acquired data are introduced. This approach is able to accommodate new classes that are introduced by incoming data and is implemented using an incremental learning algorithm that uses MLP. The testing results improved from 67.5% to 95.8% as new data were introduced and the testing results improved from 60% to 95.3% as new conditions were introduced. On average the confidence value of the framework on its decision was 0.92."}, {"id": "0705.2604", "title": "Computational Intelligence for Condition Monitoring", "abstract": "Condition monitoring techniques are described in this chapter. Two aspects of condition monitoring process are considered: (1) feature extraction; and (2) condition classification. Feature extraction methods described and implemented are fractals, Kurtosis and Mel-frequency Cepstral Coefficients. Classification methods described and implemented are support vector machines (SVM), hidden Markov models (HMM), Gaussian mixture models (GMM) and extension neural networks (ENN). The effectiveness of these features were tested using SVM, HMM, GMM and ENN on condition monitoring of bearings and are found to give good results."}, {"id": "0705.2516", "title": "Condition Monitoring of HV Bushings in the Presence of Missing Data Using Evolutionary Computing", "abstract": "The work proposes the application of neural networks with particle swarm optimisation (PSO) and genetic algorithms (GA) to compensate for missing data in classifying high voltage bushings. The classification is done using DGA data from 60966 bushings based on IEEEc57.104, IEC599 and IEEE production rates methods for oil impregnated paper (OIP) bushings. PSO and GA were compared in terms of accuracy and computational efficiency. Both GA and PSO simulations were able to estimate missing data values to an average 95% accuracy when only one variable was missing. However PSO rapidly deteriorated to 66% accuracy with two variables missing simultaneously, compared to 84% for GA. The data estimated using GA was found to classify the conditions of bushings than the PSO."}, {"id": "0705.2305", "title": "Fuzzy and Multilayer Perceptron for Evaluation of HV Bushings", "abstract": "The work proposes the application of fuzzy set theory (FST) to diagnose the condition of high voltage bushings. The diagnosis uses dissolved gas analysis (DGA) data from bushings based on IEC60599 and IEEE C57-104 criteria for oil impregnated paper (OIP) bushings. FST and neural networks are compared in terms of accuracy and computational efficiency. Both FST and NN simulations were able to diagnose the bushings condition with 10% error. By using fuzzy theory, the maintenance department can classify bushings and know the extent of degradation in the component."}, {"id": "0705.0969", "title": "Artificial Neural Networks and Support Vector Machines for Water Demand Time Series Forecasting", "abstract": "Water plays a pivotal role in many physical processes, and most importantly in sustaining human life, animal life and plant life. Water supply entities therefore have the responsibility to supply clean and safe water at the rate required by the consumer. It is therefore necessary to implement mechanisms and systems that can be employed to predict both short-term and long-term water demands. The increasingly growing field of computational intelligence techniques has been proposed as an efficient tool in the modelling of dynamic phenomena. The primary objective of this paper is to compare the efficiency of two computational intelligence techniques in water demand forecasting. The techniques under comparison are the Artificial Neural Networks (ANNs) and the Support Vector Machines (SVMs). In this study it was observed that the ANNs perform better than the SVMs. This performance is measured against the generalisation ability of the two."}], "max_similarity": 0.7171, "skipped_llm": false, "threshold": 0.55}, {"id": "on14", "group": "on_topic", "question": "Which metallic substrate combinations accelerate the rapid synthesis of vertical cylindrical carbon lattices?", "answer": "Based on the provided papers, a thin Fe catalyst layer yields rapid growth of single-walled carbon nanotubes (SWNTs) only when supported on $\\text{Al}_2\\text{O}_3$ (aluminum oxide) [1][2]. Furthermore, an $\\text{Al}_2\\text{O}_3$ support enhances the activity of Fe, Co, and Ni catalysts [1].", "sources": [{"id": "0704.1903", "title": "Growth window and possible mechanism of millimeter-thick single-walled carbon nanotube forests", "abstract": "Our group recently reproduced the water-assisted growth method, so-called \"super growth\", of millimeter-thick single-walled carbon nanotube (SWNT) forests by using C2H4/ H2/ H2O/ Ar reactant gas and Fe/ Al2O3 catalyst. In this current work, a parametric study was carried out on both reaction and catalyst conditions. Results revealed that a thin Fe catalyst layer (about 0.5 nm) yielded rapid growth of SWNTs only when supported on Al2O3, and that Al2O3 support enhanced the activity of Fe, Co, and Ni catalysts. The growth window for the rapid SWNT growth was narrow, however. Optimum amount of added H2O increased the SWNT growth rate but further addition of H2O degraded both the SWNT growth rate and quality. Addition of H2 was also essential for rapid SWNT growth, but again, further addition decreased both the SWNT growth rate and quality. Because Al2O3 catalyzes hydrocarbon reforming, Al2O3 support possibly enhances the SWNT growth rate by supplying the carbon source to the catalyst nanoparticles. The origin of the narrow window for rapid SWNT growth will also be discussed."}, {"id": "0704.0915", "title": "Millimeter-Thick Single-Walled Carbon Nanotube Forests: Hidden Role of Catalyst Support", "abstract": "A parametric study of so-called \"super growth\" of single-walled carbon nanotubes(SWNTs) was done by using combinatorial libraries of iron/aluminum oxide catalysts. Millimeter-thick forests of nanotubes grew within 10 min, and those grown by using catalysts with a thin Fe layer (about 0.5 nm) were SWNTs. Although nanotube forests grew under a wide range of reaction conditions such as gas composition and temperature, the window for SWNT was narrow. Fe catalysts rapidly grew nanotubes only when supported on aluminum oxide. Aluminum oxide, which is a well-known catalyst in hydrocarbon reforming, plays an essential role in enhancing the nanotube growth rates."}, {"id": "0704.2682", "title": "Electron-electron correlation in graphite", "abstract": "The full three dimensional dispersion of the pi-bands, Fermi velocities and effective masses are measured with angle resolved photoemission spectroscopy and compared to first-principles calculations. The band structure by density-functional theory strongly underestimates the slope of the bands and the trigonal warping effect. Including electron-electron calculation on the level of the GW approximation, however, yields remarkable agreement in the vicinity of the Fermi level. This demonstrates the breakdown of the independent electron picture in semi-metallic graphite and points towards a pronounced role of electron correlation for the interpretation of transport experiments and double-resonant Raman scattering for a wide range of carbon based materials."}, {"id": "0705.1625", "title": "Thermal Stability of Metallic Single-Walled Carbon Nanotubes: An O(N) Tight-Binding Molecular Dynamics Simulation Study", "abstract": "Order(N) Tight-Binding Molecular Dynamics (TBMD) simulations are performed to investigate the thermal stability of (10,10) metallic Single-Walled Carbon Nanotubes (SWCNT). Periodic boundary conditions (PBC) are applied in axial direction. Velocity Verlet algorithm along with the canonical ensemble molecular dynamics (NVT) is used to simulate the tubes at the targeted temperatures. The effects of slow and rapid temperature increases on the physical characteristics, structural stability and the energetics of the tube are investigated and compared. Simulations are carried out starting from room temperature and the temperature is raised in steps of 300K. Stability of the simulated metallic SWCNT is examined at each step before it is heated to higher temperatures. First indication of structural deformation is observed at 600K. For higher heat treatments the deformations are more pronounced and the bond breaking temperature is reached around 2500K. Gradual (slow) heating and thermal equilibrium (fast heating) methods give the value of radial thermal expansion coefficient in the temperature range between 300K-600K as 0.31x10^{-5}(1/K) and 0.089x10^{-5}(1/K), respectively. After 600K, both methods give the same value of 0.089x10^{-5}(1/K). The ratio of the total energy per atom with respect to temperature is found to be 3x10^{-4} eV/K."}, {"id": "0704.2024", "title": "A Tight-Binding Grand Canonical Monte Carlo Study of the Catalytic Growth of Carbon Nanotubes", "abstract": "The nucleation of carbon nanotubes on small nickel clusters is studied using a tight binding model coupled to grand canonical Monte Carlo simulations. This technique closely follows the conditions of the synthesis of carbon nanotubes by chemical vapor deposition. The possible formation of a carbon cap on the catalyst particle is studied as a function of the carbon chemical potential, for particles of different size, either crystalline or disordered. We show that these parameters strongly influence the structure of the cap/particle interface which in turn will have a strong effect on the control of the structure of the nanotube. In particular, we discuss the presence of carbon on surface or in subsurface layers."}], "max_similarity": 0.7215, "skipped_llm": false, "threshold": 0.55}, {"id": "on15", "group": "on_topic", "question": "How do we estimate high energy particle suppression in heavy ion collisions using radiative energy loss?", "answer": "To estimate high energy particle suppression in heavy-ion collisions using radiative energy loss, the available papers describe several methods and frameworks:\n\n* **Accounting for the medium's dynamics:** When calculating radiative energy loss for heavy quarks in a dynamically screened QCD medium (to first order in opacity), the resulting energy loss is almost twice that of a medium with static scattering centers, showing that quantitatively describing jet suppression in RHIC and LHC experiments requires correctly accounting for the dynamics of the medium's constituents [1].\n* **Using a three-dimensional hydrodynamical medium:** The soft thermalized nuclear medium can be described using relativistic ideal three-dimensional hydrodynamics [2]. Partonic jet energy loss is then evaluated in the context of gluon bremsstrahlung within this thermalized partonic matter [2]. This approach allows for the calculation of the nuclear modification factor ($R_{AA}$) for $\\pi_0$ production as a function of $p_T$, azimuthal angles, and rapidities to test jet energy loss across various path lengths, temperatures, and initial energies [2].\n* **Hydrodynamical evolution for LHC energies:** For computing the nuclear suppression factor ($R_{AA}$) for charged hadrons at the LHC, a hydrodynamical evolution is used to describe the soft medium that induces the energy loss [3]. Initial conditions are provided by a minijet + saturation picture, and leading order perturbative QCD (LO pQCD) computes the parton spectrum prior to distortion by energy loss [3].\n* **Considering color charge dependence:** Because gluons lose more energy than quarks due to the non-Abelian feature of QCD, differences in quark and gluon energy loss affect measured observables such as high $p_T$ $\\bar{p}/p$ ratios and nuclear modification factors for various particle species in heavy-ion collisions [4].", "sources": [{"id": "0705.3439", "title": "Radiative heavy quark energy loss in a dynamical QCD medium", "abstract": "The computation of radiative energy loss in a dynamically screened QCD medium is a key ingredient for obtaining reliable predictions for jet quenching in ultra-relativistic heavy ion collisions. We calculate, to first order in the opacity, the energy loss suffered by a heavy quark traveling through an infinite and time-independent QCD medium and show that the result for a dynamical medium is almost twice that obtained previously for a medium consisting of randomly distributed static scattering centers. A quantitative description of jet suppression in RHIC and LHC experiments thus must correctly account for the dynamics of the medium's constituents."}, {"id": "0705.2575", "title": "Radiative jet energy loss in a three-dimensional hydrodynamical medium and high $p_T$ azimuthal asymmetry of $\\pi_0$ suppression at mid and forward rapidity at RHIC", "abstract": "The nuclear modification factor $R_{AA}$ for $\\pi_0$ production in Au+Au collisions at $\\sqrt{s}=200$ AGeV is calculated, and studied at high transverse momenta $p_T$. The soft thermalized nuclear medium is described within the framework of relativ
