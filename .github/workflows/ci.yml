name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Only the light libraries: the tests fake torch / FAISS / Gemini on purpose.
      - run: pip install flask flask-sqlalchemy pymysql bcrypt python-dotenv cryptography pytest numpy
      - run: pytest -q
